[project]
name = "unit-price-agent"
version = "0.1.0"
description = "單價比價員：Discord agent，收標價牌或商品照片，換算單價並和同一個人的歷史同類商品比較"
requires-python = ">=3.12,<3.13"
dependencies = [
    "discord-py>=2.7.1",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unit_price_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
